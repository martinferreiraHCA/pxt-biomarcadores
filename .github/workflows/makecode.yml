# Compila la extensión con la CLI de MakeCode en cada push / pull request.
# Ver docs/11-pruebas-ci-y-publicacion.md para una explicación paso a paso.
name: MakeCode

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [18.x]
    steps:
      - uses: actions/checkout@v4
      - name: Usar Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
      - name: Instalar pxt y el target micro:bit
        run: |
          npm install -g pxt
          pxt target microbit
      - name: Compilar la extensión (TypeScript local + C++ en la nube)
        run: |
          pxt install
          pxt build --cloud
